<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fbf7f8">
  <title>Painel profissional | Estétika</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#29242a;--muted:#89818a;--line:#eee7eb;--rose:#bd7892;--rose-dark:#a65f7b;--canvas:#faf7f8}
    *{box-sizing:border-box} body{font-family:'DM Sans',sans-serif;background:radial-gradient(ellipse at 5% 0%,rgba(235,196,210,.30),transparent 34%),radial-gradient(ellipse at 95% 30%,rgba(225,213,226,.25),transparent 32%),var(--canvas);color:var(--ink)}
    h1,h2,h3{font-family:'Manrope',sans-serif;letter-spacing:-.035em}
    .surface{background:rgba(255,255,255,.9);border:1px solid rgba(238,231,235,.95);box-shadow:0 16px 48px rgba(70,48,61,.055)}
    .icon{width:18px;height:18px;stroke-width:1.8;flex:none}.icon-sm{width:15px;height:15px}.icon-lg{width:22px;height:22px}
    .action{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:13px;padding:11px 16px;font-weight:700;font-size:13px;transition:.2s}
    .action:hover{transform:translateY(-1px)} .primary{background:#302a30;color:white;box-shadow:0 7px 18px rgba(48,42,48,.13)} .primary:hover{background:#171417}
    .soft{background:#fff;border:1px solid var(--line);color:#514850}.soft:hover{border-color:#d9b8c5;background:#fffafd}
    .tab{border:1px solid transparent;background:transparent;color:#817780}.tab.active{background:#302a30;color:white;box-shadow:0 6px 16px rgba(48,42,48,.12)}
    .appointment{transition:transform .2s,box-shadow .2s}.appointment:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(70,48,61,.09)}
    button{cursor:pointer}
    @media(max-width:640px){.page-wrap{padding:18px!important}.top-actions{width:100%}.top-actions a{flex:1}}
  </style>
</head>
<body class="min-h-screen">
  <main class="page-wrap max-w-6xl mx-auto px-6 py-8 md:py-10">
    <header class="surface rounded-[28px] p-5 md:p-7 mb-7">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
        <div class="flex items-center gap-4 min-w-0">
          <div class="w-[68px] h-[68px] rounded-[22px] bg-[#f7edf1] border border-[#f0dfe6] p-1.5 flex-none overflow-hidden">
            <img id="logo" src="https://placehold.co/100x100/png" alt="Logo do studio" class="w-full h-full rounded-[17px] object-cover">
          </div>
          <div class="min-w-0">
            <p class="text-[10px] uppercase tracking-[.22em] font-bold text-[#b17a90] mb-1">ESTÉTIKA · ÁREA PROFISSIONAL</p>
            <h1 id="studioName" class="text-2xl md:text-[30px] font-extrabold truncate">Meu Studio</h1>
            <p class="text-sm text-[#918790] mt-1">Visão geral dos seus atendimentos</p>
          </div>
        </div>
        <nav class="top-actions flex flex-wrap gap-2">
          <a href="perfil.html" class="action soft"><i data-lucide="user-round" class="icon"></i>Meu perfil</a>
          <a href="servicos.html" class="action primary"><i data-lucide="sparkles" class="icon"></i>Serviços</a>
        </nav>
      </div>
    </header>

    <section class="mb-7">
      <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3 mb-4">
        <div><p class="text-[10px] uppercase tracking-[.2em] font-bold text-[#b17a90] mb-1">GESTÃO DE AGENDA</p>
          <h2 class="text-2xl md:text-[28px] font-extrabold">Seus agendamentos</h2>
          <p class="text-sm text-[#918790] mt-1">Acompanhe e gerencie os atendimentos do studio.</p></div>
        <div class="inline-flex items-center gap-2 text-xs text-[#8e858d] bg-white/80 border border-[#eee7eb] rounded-full px-3 py-2"><i data-lucide="shield-check" class="icon icon-sm"></i>Área segura do studio</div>
      </div>
      <div class="surface rounded-2xl p-2 flex flex-wrap gap-2 mb-5">
        <button onclick="filtrar('booked')" id="btn-booked" class="tab active action"><i data-lucide="calendar-clock" class="icon"></i>Agendados</button>
        <button onclick="filtrar('done')" id="btn-done" class="tab action"><i data-lucide="check-circle-2" class="icon"></i>Concluídos</button>
        <button onclick="filtrar('cancelled')" id="btn-cancelled" class="tab action"><i data-lucide="calendar-x" class="icon"></i>Cancelados</button>
      </div>
    </section>

    <section id="lista" class="grid grid-cols-1 md:grid-cols-2 gap-4" aria-live="polite"></section>
    <footer class="text-center text-[11px] text-[#aaa0a8] py-8">Estétika · Gestão profissional de atendimentos</footer>
  </main>
  <script>if(window.lucide)lucide.createIcons();</script>
  <script src="painel.js"></script>
</body>
</html>
