<!DOCTYPE html>
<html lang="pt-br">
<head>

  <link
        rel="icon"
        type="image/png"
        href="../img/estetika.png"
    >
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar na sua conta</title>
  <link rel="icon" type="image/png" href="/img/estetika.png">
  <link rel="apple-touch-icon" href="nekko-beauty//img/estetika.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen flex items-center justify-center p-4 bg-[#d1d1d1] text-[#45433f]">
  <main class="w-full max-w-md rounded-2xl border border-[#545454] bg-[#ffffff] p-7 sm:p-9 shadow-xl shadow-[#545454]/30">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center overflow-hidden rounded-2xl border border-[#bdbdbd] bg-[#e0e0e0] shadow-sm" aria-hidden="true">
        <img src="/img/estetika.png" alt="" class="h-full w-full object-contain" onerror="this.style.display='none'">
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-[#393939]">Bem-vindo de volta</h1>
      <p class="mt-2 text-sm text-[#707070]">Entre com seus dados para continuar.</p>
    </div>

    <div class="space-y-4">
      <div>
        <label for="email" class="mb-1.5 block text-sm font-medium text-[#555555]">E-mail</label>
        <input
          id="email"
          type="email"
          placeholder="voce@exemplo.com"
          autocomplete="email"
          class="w-full rounded-xl border border-[#bdbdbd] bg-white px-4 py-3 text-[#393939] placeholder:text-[#929292] outline-none transition focus:border-[#666666] focus:ring-4 focus:ring-[#e0e0e0]"
        >
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-sm font-medium text-[#555555]">Senha</label>
        <input
          id="password"
          type="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          class="w-full rounded-xl border border-[#bdbdbd] bg-white px-4 py-3 text-[#393939] placeholder:text-[#929292] outline-none transition focus:border-[#666666] focus:ring-4 focus:ring-[#e0e0e0]"
        >
      </div>

      <button
        id="btnLogin"
        type="button"
        class="w-full rounded-xl bg-[#666666] py-3 font-semibold text-white shadow-md shadow-[#545454]/30 transition duration-200 hover:bg-[#4d4d4d] focus:outline-none focus:ring-4 focus:ring-[#d1d1d1] inline-flex items-center justify-center gap-2"
      >
        <i data-lucide="log-in" class="h-5 w-5" aria-hidden="true"></i>
        <span>Entrar</span>
      </button>

      <div class="flex items-center gap-3 py-1" aria-hidden="true">
        <div class="h-px flex-1 bg-[#c9c9c9]"></div>
        <span class="text-xs text-[#777777]">AINDA NÃO TEM CONTA?</span>
        <div class="h-px flex-1 bg-[#c9c9c9]"></div>
      </div>

      <button
        id="btnSignup"
        type="button"
        class="w-full rounded-xl border border-[#666666] bg-[#e0e0e0] py-3 font-semibold text-[#45433f] transition duration-200 hover:border-[#545454] hover:bg-[#d1d1d1] focus:outline-none focus:ring-4 focus:ring-[#e0e0e0] inline-flex items-center justify-center gap-2"
      >
        <i data-lucide="user-round-plus" class="h-5 w-5" aria-hidden="true"></i>
        <span>Criar conta</span>
      </button>
    </div>

    <p id="msg" role="status" aria-live="polite" class="mt-5 min-h-[20px] text-center text-sm text-[#666666]"></p>

    <div class="mt-6 flex items-center justify-center gap-2 border-t border-[#e0e0e0] pt-4 text-[#999999]" aria-label="Estétika">
      <i data-lucide="sparkles" class="h-4 w-4" aria-hidden="true"></i>
      <span class="text-xs font-medium tracking-[0.18em]">ESTÉTIKA</span>
    </div>
  </main>

  
  <script src="index.js"></script>
</body>
</html>
