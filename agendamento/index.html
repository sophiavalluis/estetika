<!DOCTYPE html>
<html lang="pt-br">
<head>

 <link
        rel="icon"
        type="image/png"
        href="../img/estetika.png"
    >
 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agende seu horário | Estétika</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#29242a;--muted:#89818a;--line:#eee8eb;--rose:#c77f98;--rose-dark:#a95f7b;--paper:#fff;--canvas:#faf7f8}
*{box-sizing:border-box}
body{font-family:'DM Sans',sans-serif!important;background:radial-gradient(ellipse at 8% 5%,rgba(235,196,210,.28),transparent 36%),radial-gradient(ellipse at 95% 38%,rgba(225,213,226,.32),transparent 35%),var(--canvas)!important;color:var(--ink)!important}
h1,h2,h3{font-family:'Manrope',sans-serif!important;letter-spacing:-.035em}
body>div,main>div,.max-w-4xl,.max-w-3xl,.max-w-2xl,.max-w-md{position:relative}
body>div>div,main.w-full.max-w-md,.max-w-4xl>div,.max-w-3xl>div,.max-w-2xl>div{
 background:rgba(255,255,255,.92)!important;border:1px solid rgba(238,232,235,.95)!important;
 border-radius:26px!important;box-shadow:0 18px 55px rgba(70,48,61,.07)!important
}
input,select,textarea{border:1px solid #e9dfe4!important;border-radius:14px!important;background:#fff!important;color:var(--ink)!important;transition:border-color .2s,box-shadow .2s!important}
input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--rose)!important;box-shadow:0 0 0 4px rgba(199,127,152,.13)!important}
button{border-radius:15px!important;font-family:'DM Sans',sans-serif!important;font-weight:700!important;transition:transform .18s,box-shadow .18s,background .18s!important}
button:hover{transform:translateY(-1px)}
a{transition:color .18s}
img{max-width:100%}
.bg-white{background:#fff!important}
.text-black,.text-gray-800,.text-gray-900{color:var(--ink)!important}
.text-gray-500,.text-gray-600{color:var(--muted)!important}
.border-gray-200,.border-gray-300{border-color:var(--line)!important}
.shadow-xl,.shadow-lg,.shadow{box-shadow:0 12px 35px rgba(70,48,61,.07)!important}
.rounded-3xl{border-radius:26px!important}
.rounded-2xl{border-radius:18px!important}
.bg-\[\#CFCFCF\],.bg-\[\#d1d1d1\],.bg-pink-500{background:var(--rose)!important;color:white!important}
.hover\:bg-pink-600:hover{background:var(--rose-dark)!important}
.border-\[\#696969\],.border-\[\#545454\],.border-\[\#bdbdbd\]{border-color:var(--line)!important}
.text-\[\#696969\],.text-\[\#45433f\],.text-\[\#393939\]{color:var(--ink)!important}
@media(max-width:640px){body{padding:16px!important}body>div,main.w-full.max-w-md{padding:22px!important;border-radius:22px!important}}
</style>

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen flex items-center justify-center p-4 bg-[#CFCFCF]">

<div class="bg-white rounded-3xl shadow-xl p-6 w-full max-w-md">

  <div class="text-center mb-6">
    <img id="logo"
      src="https://placehold.co/100x100/png"
      class="w-24 h-24 rounded-full mx-auto object-cover border-4 border-[#696969] mb-3">

    <h1 id="studioName" class="text-2xl font-bold text-black">Studio</h1>
  </div>

  <label class="font-semibold">Serviço</label>
  <select id="service" class="w-full p-3 border rounded-xl mb-4">
    <option>Carregando...</option>
  </select>

  <div
  id="serviceDescription"
  class="
    hidden
    bg-gray-100
    rounded-2xl
    p-4
    mb-4
  "
>

  <p class="font-semibold text-sm mb-1">
    Sobre este serviço:
  </p>

  <p
    id="serviceDescriptionText"
    class="text-sm text-[#696969] whitespace-pre-wrap"
  ></p>

</div>

<!-- ADICIONAIS -->
<div
  id="addonsArea"
  class="mb-4"
  style="display:none;"
>

  <label class="font-semibold block mb-2">
    Adicionais
  </label>

  <div
    id="addonsList"
    class="space-y-2"
  ></div>
  
  <div
    id="totalsArea"
    class="
      mt-4
      bg-gray-100
      rounded-2xl
      p-4
    "
  >
  
    <p
      id="totalPrice"
      class="font-semibold"
    >
      <i data-lucide="wallet" class="inline-block w-4 h-4 mr-1 align-[-3px]"></i>Total: R$ 0,00
    </p>
  
    <p
      id="totalDuration"
      class="text-sm text-[#696969]"
    >
      ⏰ Tempo total: 0 min
    </p>
  
  </div>

  <label class="font-semibold">Data</label>
  <input type="date" id="date" class="w-full p-3 border rounded-xl mb-4">

  <label class="font-semibold">Horários</label>
  <div id="times" class="grid grid-cols-3 gap-2 mb-4"></div>

  <input id="name" placeholder="Seu nome" class="w-full p-3 border rounded-xl mb-3">
  <input id="phone" placeholder="WhatsApp" class="w-full p-3 border rounded-xl mb-4">
  <textarea
  id="description"
  maxlength="500"
  placeholder="Descrição (opcional)"
  class="w-full p-3 border rounded-xl mb-1 resize-none h-28"
></textarea>

<p class="text-xs text-gray-500 mb-4">
  Máximo de 500 caracteres
</p>

<label class="font-semibold block mb-2">
  Enviar fotos (máx 2)
</label>

<input
  type="file"
  id="photos"
  accept="image/*"
  multiple
  class="
    w-full
    p-3
    border
    border-[#696969]
    rounded-xl
    mb-4
    bg-white
    text-sm
  "
>

  <button onclick="agendar()"
    class="w-full bg-[#CFCFCF] hover:bg-[#BEBEBE] text-white border border-[#696969] p-3 rounded-xl font-bold transition">
    Confirmar agendamento
  </button>

</div>



  <script src="index.js"></script>
</body>
</html>
