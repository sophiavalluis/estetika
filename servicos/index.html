<!DOCTYPE html>
<html lang="pt-br">
<head>

  <link
        rel="icon"
        type="image/png"
        href="../img/estetika.png"
    >

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Serviços | Estétika</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#29242a;--muted:#89818a;--line:#eee8eb;--rose:#c77f98;--rose-dark:#a95f7b;--paper:#fff;--canvas:#f3f4f6}
*{box-sizing:border-box}
body{font-family:'Inter',sans-serif!important;background:#f3f4f6!important;color:var(--ink)!important}
h1,h2,h3{font-family:'Manrope',sans-serif!important;letter-spacing:-.035em}
body>div,main>div,.max-w-4xl,.max-w-3xl,.max-w-2xl,.max-w-md{position:relative}
body>div>div,main.w-full.max-w-md,.max-w-4xl>div,.max-w-3xl>div,.max-w-2xl>div{
 background:rgba(255,255,255,.92)!important;border:1px solid rgba(238,232,235,.95)!important;
 border-radius:26px!important;box-shadow:0 18px 55px rgba(70,48,61,.07)!important
}
input,select,textarea{border:1px solid #e9dfe4!important;border-radius:14px!important;background:#fff!important;color:var(--ink)!important;transition:border-color .2s,box-shadow .2s!important}
input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--rose)!important;box-shadow:0 0 0 4px rgba(199,127,152,.13)!important}
button{border-radius:15px!important;font-family:'Inter',sans-serif!important;font-weight:700!important;transition:transform .18s,box-shadow .18s,background .18s!important}
button:hover{transform:translateY(-1px)}
a{transition:color .18s}
img{max-width:100%}
.bg-white{background:#fff!important}
.text-black,.text-gray-800,.text-gray-900{color:var(--ink)!important}
.text-gray-500,.text-gray-600{color:var(--muted)!important}
.border-gray-200,.border-gray-300{border-color:var(--line)!important}
.shadow-xl,.shadow-lg,.shadow{box-shadow:0 12px 35px rgba(70,48,61,.07)!important}
.rounded-3xl{border-radius:26px!important}
.rounded-2xl{border-radius:18px!important}
.bg-\[\#CFCFCF\],.bg-\[\#d1d1d1\],.bg-pink-500{background:var(--rose)!important;color:white!important}
.hover\:bg-pink-600:hover{background:var(--rose-dark)!important}
.border-\[\#696969\],.border-\[\#545454\],.border-\[\#bdbdbd\]{border-color:var(--line)!important}
.text-\[\#696969\],.text-\[\#45433f\],.text-\[\#393939\]{color:var(--ink)!important}
@media(max-width:640px){body{padding:16px!important}body>div,main.w-full.max-w-md{padding:22px!important;border-radius:22px!important}}

/* acabamento premium da tela de serviços */
#lista h2,#listaAddons h2{color:#302832!important;font-weight:700;letter-spacing:-.025em}
#lista p,#listaAddons p{color:#77717b!important}
#lista button,#listaAddons button{font-size:13px;letter-spacing:.01em}
#lista .text-blue-600{color:#a95f7b!important}
#lista .bg-yellow-500{background:#d5a64b!important}
#lista .bg-green-500{background:#6f9b86!important}
#lista .bg-red-500,#listaAddons .bg-red-500{background:#bd7588!important}
#lista .bg-yellow-500:hover,#lista .bg-green-500:hover,#lista .bg-red-500:hover{filter:brightness(.96)}
@media(max-width:640px){#lista>div,#listaAddons>div{align-items:flex-start!important;gap:16px;flex-direction:column}}
</style>

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100 min-h-screen p-6">

  <div class="max-w-3xl mx-auto">

    <!-- TOPO -->
    <div class="flex items-center justify-between mb-6">

      <h1 class="text-3xl font-bold text-black">
        Serviços
      </h1>

      <a
        href="/perfil/"
        class="bg-white border border-[#696969] text-[#696969] px-4 py-2 rounded-2xl shadow"
      >
        <i data-lucide="user-round" class="inline-block w-4 h-4 mr-1 align-[-3px]"></i> Perfil
      </a>

    </div>

    <!-- FORM -->
    <div class="bg-white p-6 rounded-3xl shadow-xl mb-6">

      <h2 class="text-xl font-bold mb-4">
        Novo Serviço
      </h2>

      <div class="grid md:grid-cols-3 gap-3">

        <input
          id="name"
          placeholder="Nome"
          class="p-3 border border-[#696969] rounded-2xl"
        >

        <input
          id="price"
          type="number"
          placeholder="Preço"
          class="p-3 border border-[#696969] rounded-2xl"
        >

        <input
          id="duration"
          type="number"
          placeholder="Duração (min)"
          class="p-3 border border-[#696969] rounded-2xl"
        >
        
        <textarea
          id="description"
          placeholder="Descrição do serviço (opcional)"
          class="p-3 border border-[#696969] rounded-2xl md:col-span-3 h-28 resize-none"
        ></textarea>
        
      </div>

      <button
        id="salvar"
        class="
          mt-4
          w-full
          bg-[#CFCFCF]
          hover:bg-[#B8B8B8]
          text-white
          p-3
          rounded-2xl
          font-bold
          transition
        "
      >
        Salvar serviço
      </button>

    </div>

<!-- NOVO ADICIONAL -->
<div class="bg-white p-6 rounded-3xl shadow-xl mb-6">

  <h2 class="text-xl font-bold mb-4">
    Novo adicional
  </h2>

  <div class="grid md:grid-cols-3 gap-3">

    <input
      id="addonName"
      placeholder="Nome do adicional"
      class="p-3 border border-[#696969] rounded-2xl"
    >

    <input
      id="addonPrice"
      type="number"
      placeholder="Preço"
      class="p-3 border border-[#696969] rounded-2xl"
    >

    <input
      id="addonDuration"
      type="number"
      placeholder="Duração (min)"
      class="p-3 border border-[#696969] rounded-2xl"
    >

  </div>

  <button
    id="salvarAddon"
    class="
      mt-4
      w-full
      bg-[#696969]
      hover:bg-[#4F4F4F]
      text-white
      p-3
      rounded-2xl
      font-bold
      transition
    "
  >
    Salvar adicional
  </button>

</div>

    <!-- LISTA -->
    <div
      id="lista"
      class="space-y-4"
    ></div>

  <!-- LISTA ADICIONAIS -->
    <div
      id="listaAddons"
      class="space-y-4 mt-6"
    ></div>

  </div>



  <script src="index.js"></script>
</body>
</html>
