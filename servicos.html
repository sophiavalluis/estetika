<!DOCTYPE html>
<html lang="pt-br">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Serviços | Estétika</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#29242a;--muted:#89818a;--line:#eee8eb;--rose:#c77f98;--rose-dark:#a95f7b;--paper:#fff;--canvas:#faf7f8}
*{box-sizing:border-box}
body{font-family:'DM Sans',sans-serif!important;background:radial-gradient(ellipse at 8% 5%,rgba(235,196,210,.28),transparent 36%),radial-gradient(ellipse at 95% 38%,rgba(225,213,226,.32),transparent 35%),var(--canvas)!important;color:var(--ink)!important}
h1,h2,h3{font-family:'Manrope',sans-serif!important;letter-spacing:-.035em}
body>div,main>div,.max-w-4xl,.max-w-3xl,.max-w-2xl,.max-w-md{position:relative}
body>div>div,main.w-full.max-w-md,.max-w-4xl>div,.max-w-3xl>div,.max-w-2xl>div{
 background:rgba(255,255,255,.92)!important;border:1px solid rgba(238,232,235,.95)!important;
 border-radius:26px!important;box-shadow:0 18px 55px rgba(70,48,61,.07)!important
}
input,select,textarea{border:1px solid #e9dfe4!important;border-radius:14px!important;background:#fff!important;color:var(--ink)!important;transition:border-color .2s,box-shadow .2s!important}
input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--rose)!important;box-shadow:0 0 0 4px rgba(199,127,152,.13)!important}
button{border-radius:15px!important;font-family:'DM Sans',sans-serif!important;font-weight:700!important;transition:transform .18s,box-shadow .18s,background .18s!important}
button:hover{transform:translateY(-1px)}
a{transition:color .18s}
img{max-width:100%}
.bg-white{background:#fff!important}
.text-black,.text-gray-800,.text-gray-900{color:var(--ink)!important}
.text-gray-500,.text-gray-600{color:var(--muted)!important}
.border-gray-200,.border-gray-300{border-color:var(--line)!important}
.shadow-xl,.shadow-lg,.shadow{box-shadow:0 12px 35px rgba(70,48,61,.07)!important}
.rounded-3xl{border-radius:26px!important}
.rounded-2xl{border-radius:18px!important}
.bg-\[\#CFCFCF\],.bg-\[\#d1d1d1\],.bg-pink-500{background:var(--rose)!important;color:white!important}
.hover\:bg-pink-600:hover{background:var(--rose-dark)!important}
.border-\[\#696969\],.border-\[\#545454\],.border-\[\#bdbdbd\]{border-color:var(--line)!important}
.text-\[\#696969\],.text-\[\#45433f\],.text-\[\#393939\]{color:var(--ink)!important}
@media(max-width:640px){body{padding:16px!important}body>div,main.w-full.max-w-md{padding:22px!important;border-radius:22px!important}}
</style>

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-[#CFCFCF] min-h-screen p-6">

  <div class="max-w-3xl mx-auto">

    <!-- TOPO -->
    <div class="flex items-center justify-between mb-6">

      <h1 class="text-3xl font-bold text-black">
        Serviços
      </h1>

      <a
        href="painel.html"
        class="bg-white border border-[#696969] text-[#696969] px-4 py-2 rounded-2xl shadow"
      >
        Painel
      </a>

    </div>

    <!-- FORM -->
    <div class="bg-white p-6 rounded-3xl shadow-xl mb-6">

      <h2 class="text-xl font-bold mb-4">
        Novo Serviço
      </h2>

      <div class="grid md:grid-cols-3 gap-3">

        <input
          id="name"
          placeholder="Nome"
          class="p-3 border border-[#696969] rounded-2xl"
        >

        <input
          id="price"
          type="number"
          placeholder="Preço"
          class="p-3 border border-[#696969] rounded-2xl"
        >

        <input
          id="duration"
          type="number"
          placeholder="Duração (min)"
          class="p-3 border border-[#696969] rounded-2xl"
        >
        
        <textarea
          id="description"
          placeholder="Descrição do serviço (opcional)"
          class="p-3 border border-[#696969] rounded-2xl md:col-span-3 h-28 resize-none"
        ></textarea>
        
      </div>

      <button
        id="salvar"
        class="
          mt-4
          w-full
          bg-[#CFCFCF]
          hover:bg-[#B8B8B8]
          text-white
          p-3
          rounded-2xl
          font-bold
          transition
        "
      >
        Salvar serviço
      </button>

    </div>

<!-- NOVO ADICIONAL -->
<div class="bg-white p-6 rounded-3xl shadow-xl mb-6">

  <h2 class="text-xl font-bold mb-4">
    Novo adicional
  </h2>

  <div class="grid md:grid-cols-3 gap-3">

    <input
      id="addonName"
      placeholder="Nome do adicional"
      class="p-3 border border-[#696969] rounded-2xl"
    >

    <input
      id="addonPrice"
      type="number"
      placeholder="Preço"
      class="p-3 border border-[#696969] rounded-2xl"
    >

    <input
      id="addonDuration"
      type="number"
      placeholder="Duração (min)"
      class="p-3 border border-[#696969] rounded-2xl"
    >

  </div>

  <button
    id="salvarAddon"
    class="
      mt-4
      w-full
      bg-[#696969]
      hover:bg-[#4F4F4F]
      text-white
      p-3
      rounded-2xl
      font-bold
      transition
    "
  >
    Salvar adicional
  </button>

</div>

    <!-- LISTA -->
    <div
      id="lista"
      class="space-y-4"
    ></div>

  <!-- LISTA ADICIONAIS -->
    <div
      id="listaAddons"
      class="space-y-4 mt-6"
    ></div>

  </div>

<script>

document.addEventListener("DOMContentLoaded", async () => {

  // 🔗 SUPABASE
  const supabase =
    window.supabase.createClient(
      "https://bjaurtrqrasznuptthyf.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqYXVydHJxcmFzem51cHR0aHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MDkwNTIsImV4cCI6MjA5MzQ4NTA1Mn0.iCQyvzAJykzgLO4kZkJZ8qNbv3549rG_JuwcVEZDrKA"
    );

  // 🔐 USER
  const {
    data: { user }
  } = await supabase.auth.getUser();

  if (!user) {

    window.location.href =
      "login.html";

    return;
  }

  // 📦 ELEMENTOS
  const lista =
    document.getElementById("lista");

  const listaAddons =
    document.getElementById("listaAddons");

  const btnSalvar =
    document.getElementById("salvar");

  const btnSalvarAddon =
    document.getElementById("salvarAddon");

  // 📥 CARREGAR
  async function carregarServicos() {

    lista.innerHTML = `
      <div class="text-center text-gray-500">
        Carregando...
      </div>
    `;

    const {
      data,
      error
    } = await supabase
      .from("services")
      .select("*")
      .eq("user_id", user.id)
      .order("created_at", {
        ascending: false
      });

    if (error) {

      console.log(error);

      lista.innerHTML = `
        <div class="text-red-500">
          Erro ao carregar
        </div>
      `;

      return;
    }

    if (!data || data.length === 0) {

      lista.innerHTML = `
        <div class="bg-white p-8 rounded-3xl text-center shadow">
          <p class="text-[#696969]">
            Nenhum serviço cadastrado
          </p>
        </div>
      `;

      return;
    }

    lista.innerHTML = "";

    data.forEach(servico => {

      const div =
        document.createElement("div");

      div.className = `
        bg-white
        p-5
        rounded-3xl
        shadow-md
        flex
        justify-between
        items-center
      `;

      div.innerHTML = `

        <div>

          <h2 class="font-bold text-lg">
            ${servico.name}
          </h2>

          <p class="text-[#696969] mt-1">
            <i data-lucide="wallet" class="inline-block w-4 h-4 mr-1 align-[-3px]"></i>R$${Number(servico.price).toFixed(2)}
          </p>

          <p class="text-[#808080] text-sm">
            ⏰ ${servico.duration} min
          </p>

          ${
            servico.description
              ? `
                <button
                  onclick="toggleDescricao(${servico.id})"
                  class="
                    text-sm
                    text-[#696969]
                    mt-2
                    underline
                  "
                >
                  ⬇️ Ver descrição
                </button>
          
                <div
                  id="descricao-${servico.id}"
                  class="hidden mt-2"
                >
          
                  <p class="
                    text-[#696969]
                    text-sm
                    whitespace-pre-wrap
                    mb-3
                  ">
                    <i data-lucide="file-text" class="inline-block w-4 h-4 mr-1 align-[-3px]"></i> ${servico.description}
                  </p>
          
                  <button
                    onclick="mostrarEdicao(${servico.id})"
                    class="
                      text-sm
                      text-blue-600
                      underline
                      mb-2
                    "
                  >
                    ✏️ Editar descrição
                  </button>
          
                  <div
                    id="editar-${servico.id}"
                    class="hidden"
                  >
          
                    <textarea
                      id="textarea-${servico.id}"
                      class="
                        w-full
                        border
                        border-[#696969]
                        rounded-2xl
                        p-3
                        text-sm
                        h-28
                        resize-none
                      "
                    >${servico.description}</textarea>
          
                    <button
                      onclick="salvarDescricao(${servico.id})"
                      class="
                        mt-2
                        bg-[#696969]
                        text-white
                        px-4
                        py-2
                        rounded-2xl
                        text-sm
                      "
                    >
                      Salvar descrição
                    </button>
          
                  </div>
          
                </div>
              `
              : ""
          }
          
        </div>

        <div class="flex gap-2">

          <button
            onclick="toggleServico(${servico.id}, ${servico.active})"
            class="
              px-4
              py-2
              rounded-2xl
              text-white
              font-semibold
              ${servico.active ? 'bg-yellow-500' : 'bg-green-500'}
            "
          >
            ${servico.active ? 'Desativar' : 'Ativar'}
          </button>

          <button
            onclick="deletarServico(${servico.id})"
            class="
              px-4
              py-2
              rounded-2xl
              bg-red-500
              text-white
              font-semibold
            "
          >
            Excluir
          </button>

        </div>

      `;

      lista.appendChild(div);
      if (window.lucide) window.lucide.createIcons({ root: div });

    });

  }

// 📥 CARREGAR ADICIONAIS
async function carregarAddons() {

  listaAddons.innerHTML = `
    <div class="text-center text-gray-500">
      Carregando adicionais...
    </div>
  `;

  const {
    data,
    error
  } = await supabase
    .from("service_addons")
    .select("*")
    .eq("user_id", user.id)
    .order("created_at", {
      ascending: false
    });

  if (error) {

    console.log(error);

    listaAddons.innerHTML = `
      <div class="text-red-500">
        Erro ao carregar adicionais
      </div>
    `;

    return;
  }

  if (!data || data.length === 0) {

    listaAddons.innerHTML = `
      <div class="bg-white p-6 rounded-3xl shadow text-center">
        Nenhum adicional cadastrado
      </div>
    `;

    return;
  }

  listaAddons.innerHTML = "";

  data.forEach(addon => {

    const div =
      document.createElement("div");

    div.className = `
      bg-white
      p-5
      rounded-3xl
      shadow-md
      flex
      justify-between
      items-center
    `;

    div.innerHTML = `

      <div>
    
        <h2 class="font-bold text-lg">
          ✨ ${addon.name}
        </h2>
    
        <p class="text-[#696969] mt-1">
          <i data-lucide="wallet" class="inline-block w-4 h-4 mr-1 align-[-3px]"></i>R$${Number(addon.price).toFixed(2)}
        </p>
    
        <p class="text-[#808080] text-sm">
          ⏰ ${addon.duration} min
        </p>
    
      </div>
    
      <div class="flex gap-2">
    
        <button
          onclick="toggleAddon('${addon.id}', ${addon.active})"
          class="
            px-4
            py-2
            rounded-2xl
            text-white
            font-semibold
            ${addon.active ? 'bg-yellow-500' : 'bg-green-500'}
          "
        >
          ${addon.active ? 'Desativar' : 'Ativar'}
        </button>
    
        <button
          onclick="deletarAddon('${addon.id}')"
          class="
            px-4
            py-2
            rounded-2xl
            bg-red-500
            text-white
            font-semibold
          "
        >
          Excluir
        </button>
    
      </div>
    
    `;

    listaAddons.appendChild(div);

  });

}


 // 💾 SALVAR
btnSalvar.addEventListener("click", async () => {

  const name =
    document.getElementById("name").value;

  const price =
    document.getElementById("price").value;

  const duration =
    document.getElementById("duration").value;

  const description =
    document.getElementById("description").value;

  if (!name || !price || !duration) {

    alert("Preencha tudo");

    return;
  }

  const { error } =
    await supabase
      .from("services")
      .insert([
        {
          user_id: user.id,
          name,
          price,
          duration,
          description,
          active: true
        }
      ]);

  if (error) {

    console.log(error);

    alert("Erro ao salvar");

    return;
  }

  // LIMPAR
  document.getElementById("name").value = "";
  document.getElementById("price").value = "";
  document.getElementById("duration").value = "";
  document.getElementById("description").value = "";

  carregarServicos();

});


// 💾 SALVAR ADICIONAL
btnSalvarAddon.addEventListener("click", async () => {

  const name =
    document.getElementById("addonName").value;

  const price =
    document.getElementById("addonPrice").value;

  const duration =
    document.getElementById("addonDuration").value;

  if (!name || !price || !duration) {

    alert("Preencha tudo");

    return;
  }

  const { error } =
    await supabase
      .from("service_addons")
      .insert([
        {
          user_id: user.id,
          name,
          price,
          duration,
          active: true
        }
      ]);

  if (error) {

    console.log(error);

    alert("Erro ao salvar adicional");

    return;
  }

  // LIMPAR
  document.getElementById("addonName").value = "";
  document.getElementById("addonPrice").value = "";
  document.getElementById("addonDuration").value = "";

  alert("Adicional salvo!");

  carregarAddons();

});

  // 🔄 ATIVAR/DESATIVAR
  window.toggleServico = async function (id, ativo) {

    await supabase
      .from("services")
      .update({
        active: !ativo
      })
      .eq("id", id)
      .eq("user_id", user.id);

    carregarServicos();

  };

  window.toggleAddon = async function (id, ativo) {

    await supabase
      .from("service_addons")
      .update({
        active: !ativo
      })
      .eq("id", id)
      .eq("user_id", user.id);
  
    carregarAddons();
  
  };

// MOSTRAR / OCULTAR DESCRIÇÃO
window.toggleDescricao = function(id) {

  const div =
    document.getElementById(
      `descricao-${id}`
    );

  const button =
    event.target;

  if (div.classList.contains("hidden")) {

    div.classList.remove("hidden");

    button.innerHTML =
      "⬆️ Ocultar descrição";

  } else {

    div.classList.add("hidden");

    button.innerHTML =
      "⬇️ Ver descrição";


  }

};

// MOSTRAR / OCULTAR EDIÇÃO
window.mostrarEdicao = function(id) {

  const div =
    document.getElementById(
      `editar-${id}`
    );

  div.classList.toggle("hidden");

};

// 💾 SALVAR DESCRIÇÃO
window.salvarDescricao = async function(id) {

  const textarea =
    document.getElementById(
      `textarea-${id}`
    );

  const novaDescricao =
    textarea.value;

  const { error } =
    await supabase
      .from("services")
      .update({
        description: novaDescricao
      })
      .eq("id", id)
      .eq("user_id", user.id);

  if (error) {

    console.log(error);

    alert("Erro ao salvar descrição");

    return;

  }

  carregarServicos();

};

  // ❌ EXCLUIR
  window.deletarServico = async function (id) {

    const confirmar =
      confirm("Excluir serviço?");

    if (!confirmar) return;

    await supabase
      .from("services")
      .delete()
      .eq("id", id)
      .eq("user_id", user.id);

    carregarServicos();

  };

  window.deletarAddon = async function (id) {

    const confirmar =
      confirm("Excluir adicional?");
  
    if (!confirmar) return;
  
    await supabase
      .from("service_addons")
      .delete()
      .eq("id", id)
      .eq("user_id", user.id);
  
    carregarAddons();
  
  };

  // RODAR O ESCARALHAMENTO(START dos serviços) KKKKK
  carregarServicos();
  carregarAddons();

});

</script>

</body>
</html>
